; PHP settings for the Vercel PHP runtime (vercel-php reads api/php.ini).
;
; Clearance PDFs are limited to 4 MB by the app (config/clearances.php). PHP has to accept a
; little MORE than that, so a 4 to 5 MB file reaches Laravel and gets the friendly
; "file is too large" message instead of a bare "failed to upload".
; Vercel itself refuses any request over about 4.5 MB, which is why each clearance is
; uploaded in its own request.
upload_max_filesize = 5M
post_max_size = 6M
